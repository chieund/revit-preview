<!DOCTYPE html>
<!-- Harness that runs the extension's webview bundle OUTSIDE VS Code — used for
     marketplace screenshots and scripts/smoke.js.
     Mocks acquireVsCodeApi: when the webview requests the model, it sends chunks. -->
<html>
<head>
<meta charset="utf-8">
<!-- Same CSP as the real webview (src/ifcEditorProvider.ts) — catches CSP regressions -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' 'unsafe-eval' blob:;
               style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:;
               worker-src 'self' blob:; connect-src 'self';">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
  #root { width: 100%; height: 100%; }
</style>
</head>
<body data-wasm-dir="/media/">
  <div id="root"></div>
  <script>
    // ---- shim acquireVsCodeApi (mock extension host) ----
    window.acquireVsCodeApi = () => {
      const dispatch = (data) =>
        window.dispatchEvent(new MessageEvent("message", { data }));
      return {
        postMessage(msg) {
          if (msg.type === "requestModel") {
            const params = new URLSearchParams(location.search);
            // smoke test: messages pre-built by the extension host's own code,
            // serialized like VS Code does ({$$bin: base64} = binary)
            if (params.get("messages")) {
              fetch(params.get("messages"))
                .then((r) => r.text())
                .then((text) => {
                  const bin = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
                  const msgs = JSON.parse(text, (_k, v) => (v && typeof v.$$bin === "string" ? bin(v.$$bin) : v));
                  msgs.forEach(dispatch);
                });
              return;
            }
            const file = params.get("file") || "/samples/AC20-FZK-Haus.ifc";
            fetch(file)
              .then((r) => r.arrayBuffer())
              .then((buf) => {
                // like the extension host: Uint8Array chunks of 16 MB
                const bytes = new Uint8Array(buf);
                const CHUNK = 16 * 1024 * 1024;
                const total = Math.ceil(bytes.length / CHUNK);
                dispatch({ type: "modelMeta", name: file.split("/").pop(), byteSize: bytes.byteLength, chunks: total });
                for (let i = 0; i < total; i++) {
                  dispatch({ type: "modelChunk", data: bytes.slice(i * CHUNK, (i + 1) * CHUNK) });
                }
                dispatch({ type: "modelDone" });
              });
          }
        },
        getState: () => ({}),
        setState: () => {},
        onDidReceiveMessage: () => ({ dispose() {} }),
      };
    };
  </script>
  <script src="/media/webview.js"></script>
</body>
</html>
