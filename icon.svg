<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Icon "Revit Preview": mô hình BIM isometric + thanh kích thước,
       cùng họ với icon của dwg-previewer (nền navy, line-art xanh #4FC3F7,
       chi tiết trắng #E8EEF4, nhấn vàng #F0B429). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2A38"/>
      <stop offset="1" stop-color="#0E1620"/>
    </linearGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#bg)"/>

    <!-- mặt trên: nh màu xanh nhạt -->
    <polygon points="128,64 216,105 128,146 40,105" fill="#4FC3F7" fill-opacity="0.13"/>

    <!-- cạnh hộp: cột + khung -->
    <g stroke="#4FC3F7" stroke-width="5" stroke-linejoin="round" fill="none">
      <line x1="40" y1="105" x2="40" y2="181"/>
      <line x1="216" y1="105" x2="216" y2="181"/>
      <line x1="128" y1="146" x2="128" y2="222"/>
      <line x1="40" y1="181" x2="128" y2="222"/>
      <line x1="128" y1="222" x2="216" y2="181"/>
      <!-- sàn giữa -->
      <path d="M40 143 L128 184 L216 143" stroke-opacity="0.85"/>
      <path d="M40 143 L128 102 L216 143" stroke-opacity="0.35"/>
      <!-- mặt trên -->
      <polygon points="128,64 216,105 128,146 40,105"/>
    </g>

    <!-- cột trong, mặt trên -->
    <g stroke="#4FC3F7" stroke-width="4" stroke-opacity="0.55">
      <line x1="84" y1="124" x2="84" y2="201"/>
      <line x1="172" y1="124" x2="172" y2="201"/>
      <line x1="128" y1="83" x2="128" y2="163"/>
    </g>

    <!-- cửa sổ trên mặt tường trái (trắng mờ) -->
    <g stroke="#E8EEF4" stroke-width="3" fill="#4FC3F7" fill-opacity="0.1" stroke-linejoin="round">
      <polygon points="62,116 88,128 88,98 62,86"/>
      <polygon points="94,131 120,143 120,113 94,101"/>
    </g>

    <!-- khối tường đang được chọn (vàng, viền tối halo) -->
    <g fill="#F0B429" fill-opacity="0.3" stroke-linejoin="round">
      <polygon points="154,209 185,195 185,140 154,154" stroke="#0E1620" stroke-width="10"/>
      <polygon points="154,209 185,195 185,140 154,154" stroke="#F0B429" stroke-width="5"/>
      <g stroke="#F0B429" stroke-width="4">
        <line x1="154" y1="205" x2="146" y2="209"/>
        <line x1="185" y1="191" x2="177" y2="195"/>
      </g>
    </g>

    <!-- thanh kích thước đứng (trắng) -->
    <g stroke="#E8EEF4">
      <g stroke-width="3" stroke-opacity="0.6">
        <line x1="218" y1="105" x2="230" y2="105"/>
        <line x1="218" y1="181" x2="230" y2="181"/>
      </g>
      <line x1="234" y1="105" x2="234" y2="181" stroke-width="4"/>
      <g stroke-width="4">
        <line x1="226" y1="97" x2="242" y2="113"/>
        <line x1="226" y1="189" x2="242" y2="173"/>
      </g>
    </g>

    <!-- thanh kích thước ngang (vàng) -->
    <g stroke="#F0B429">
      <g stroke-width="3" stroke-opacity="0.75">
        <line x1="40" y1="190" x2="40" y2="238"/>
        <line x1="216" y1="190" x2="216" y2="238"/>
      </g>
      <line x1="40" y1="244" x2="216" y2="244" stroke-width="5"/>
      <g stroke-width="5">
        <line x1="32" y1="252" x2="48" y2="236"/>
        <line x1="208" y1="252" x2="224" y2="236"/>
      </g>
    </g>
  </g>
</svg>
